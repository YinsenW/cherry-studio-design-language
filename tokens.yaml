# Cherry Studio PPT 设计令牌（2026-08-20 单一来源）
# 所有颜色/字号/圆角/间距必须来自本表；AI 生成时禁止自由创建近似色

colors:
  brand_coral:
    hex: "#FF5A5F"
    rgba: "rgba(255,90,95,1)"
    role: "品牌强调/结论/甲方"
  brand_black:
    hex: "#171717"
    rgba: "rgba(23,23,23,1)"
    role: "标题/CTA"
  text_body:
    hex: "#48484E"
    rgba: "rgba(72,72,78,1)"
    role: "正文"
  text_secondary:
    hex: "#696970"
    rgba: "rgba(105,105,112,1)"
    role: "次要/说明"
  text_placeholder:
    hex: "#58585F"
    rgba: "rgba(88,88,95,1)"
    role: "占位文字"
  border_default:
    hex: "#D6D6D2"
    rgba: "rgba(214,214,210,1)"
    role: "卡片边框"
  bg_white:
    hex: "#FFFFFF"
    rgba: "rgba(255,255,255,1)"
    role: "画布/卡片底"
  bg_light_red:
    hex: "#FDEBED"
    rgba: "rgba(253,235,237,1)"
    role: "浅红强调底/短结论卡"
  bg_light_gray:
    hex: "#F5F5F3"
    rgba: "rgba(245,245,243,1)"
    role: "标签底/浅灰"
  text_white:
    hex: "#FFFFFF"
    rgba: "rgba(255,255,255,1)"
    role: "深底白字"
  partner_cyan:
    hex: "#37D8FF"
    rgba: "rgba(55,216,255,1)"
    role: "伙伴/乙方/硬件"
  partner_cyan_deep:
    hex: "#3796C8"
    rgba: "rgba(55,150,200,1)"
    role: "伙伴深青(文字)"
  dark_bg:
    hex: "#111111"
    rgba: "rgba(17,17,17,1)"
    role: "深色卡/CTA底(局部)"

font_sizes:
  page_title: 30
  card_title: 18
  body: 13
  caption: 11
  footer: 10
  kpi_number: 48

radii:
  card: 16
  tag: 16
  bar: 16

spacing:
  margin: 40
  block_gap: 24
  inner_gap: 16
  grid: 8

components:
  conclusion_bar:
    height: 34
    radius: 16
    fill: "#FDEBED"
    border: "#FF5A5F"
    text_color: "#FF5A5F"
    font_size: 13
    max_per_page: 1
    preferred_y: "420-480"
  primary_cta:
    fill: "#171717"
    text_color: "#FFFFFF"
    max_per_page: 1
  header_logo:
    size: 28
    pos: "44,24"
  footer:
    y: 510
    font_size: 10

